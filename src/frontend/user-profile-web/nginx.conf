log_format safe_path '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log safe_path;
    error_log /var/log/nginx/error.log crit;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_intercept_errors off;
    error_page 413 = @payload_too_large;
    error_page 502 504 = @service_unavailable;

    location ~ ^/(api|swagger)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @service_unavailable {
        internal;
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"The service is not ready."}';
    }

    location @payload_too_large {
        internal;
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        return 413 '{"type":"about:blank","title":"Payload Too Large","status":413,"detail":"The request body is too large."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
