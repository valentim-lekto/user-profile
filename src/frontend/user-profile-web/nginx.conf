log_format safe_path '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

map "$request_method:$uri" $auth_rate_limit_key {
    default "";
    ~*^POST:/api/auth/login/?$ "$binary_remote_addr:/api/auth/login";
    ~*^POST:/api/auth/register/?$ "$binary_remote_addr:/api/auth/register";
}

limit_req_zone $auth_rate_limit_key zone=auth_rate_limit:1m rate=10r/m;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log safe_path;
    error_log /var/log/nginx/error.log crit;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_intercept_errors off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    limit_req_status 429;
    error_page 413 = @payload_too_large;
    error_page 429 = @too_many_requests;
    error_page 502 504 = @service_unavailable;

    location ~* ^/api/auth/(login|register)/?$ {
        limit_req zone=auth_rate_limit burst=9 nodelay;

        proxy_pass http://api:8080;
        proxy_http_version 1.1;
    }

    location ~ ^/(api|swagger)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
    }

    location = /health {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
    }

    location @too_many_requests {
        internal;
        default_type application/problem+json;
        add_header Retry-After "60" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many attempts. Try again later.","instance":"$uri"}';
    }

    location @service_unavailable {
        internal;
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"The service is not ready."}';
    }

    location @payload_too_large {
        internal;
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        return 413 '{"type":"about:blank","title":"Payload Too Large","status":413,"detail":"The request body is too large."}';
    }

    location ~ \.[^/]+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
